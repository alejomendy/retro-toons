# Una vez por semana revisa qué series de la programación tienen video y actualiza
# src/data/playable.json. Al commitearlo, Vercel vuelve a desplegar y arranca la grilla
# de la semana nueva. Va de a una serie (sin apuro) para no saturar al addon del plan gratis.
name: Revisar series con video

on:
  schedule:
    # Lunes 06:00 UTC (03:00 en Argentina): arranca la semana de programación.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar series
        env:
          LACARTOONS_ADDON_URL: ${{ vars.LACARTOONS_ADDON_URL || 'https://retrotoons-tv-addon.onrender.com' }}
        run: node scripts/check-playable.mjs

      - name: Guardar la lista si cambió
        run: |
          if git diff --quiet -- src/data/playable.json; then
            echo "Sin cambios en la lista."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playable.json
          git commit -m "chore: actualizar series con video para la semana"
          git push
